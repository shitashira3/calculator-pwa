<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>เครื่องคำนวณแจม & สมาชิก</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom font for Thai */
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Hide number input arrows for better UI */
        input[type='number']::-webkit-inner-spin-button,
        input[type='number']::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white p-6 md:p-8 rounded-xl shadow-2xl border border-gray-200">
        <h2 class="text-3xl font-extrabold text-gray-800 text-center mb-6">
            เครื่องคำนวณ <span class="text-blue-600">แจม & สมาชิก</span>
        </h2>

        <!-- Input Section -->
        <div class="space-y-4">
            <div>
                <label for="hours" class="block text-sm font-medium text-gray-700 mb-1">
                    🕒 จำนวนชั่วโมง:
                </label>
                <input type="number" id="hours" placeholder="เช่น 10"
                       class="w-full p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 text-lg shadow-sm" />
            </div>

            <div>
                <label for="people" class="block text-sm font-medium text-gray-700 mb-1">
                    🧑‍🤝‍🧑 จำนวนคนทั้งหมด (ใช้หารค่าห้อง):
                </label>
                <input type="number" id="people" placeholder="เช่น 5"
                       class="w-full p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 text-lg shadow-sm" />
            </div>

            <hr class="border-gray-200 mt-4 mb-4">

            <div>
                <label for="inputJoiner" class="block text-sm font-medium text-gray-700 mb-1">
                    👤 จำนวนคนแจม:
                </label>
                <input type="number" id="inputJoiner" placeholder="เช่น 2"
                       class="w-full p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 text-lg shadow-sm" />
            </div>

            <div>
                <label for="inputMember" class="block text-sm font-medium text-gray-700 mb-1">
                    ⭐ จำนวนสมาชิก:
                </label>
                <input type="number" id="inputMember" placeholder="เช่น 3"
                       class="w-full p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 text-lg shadow-sm" />
            </div>

        </div>

        <!-- Button -->
        <button onclick="calculate()"
                class="mt-6 w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition duration-300 ease-in-out shadow-lg transform hover:scale-[1.01] focus:outline-none focus:ring-4 focus:ring-blue-500 focus:ring-opacity-50">
            คำนวณค่าใช้จ่าย 🧮
        </button>

        <!-- Result Output -->
        <div id="output" class="result mt-6 p-4 rounded-xl bg-gray-50 border border-dashed border-gray-300 min-h-20 text-gray-700">
            <p class="text-center text-gray-500">กรุณากรอกข้อมูลเพื่อคำนวณ</p>
        </div>
    </div>

    <script>
        // Removed getFloorEven function. Now only Math.floor is used.

        function calculate() {
            const hours = parseFloat(document.getElementById("hours").value);
            const people = parseFloat(document.getElementById("people").value);
            const inputJoiner = parseFloat(document.getElementById("inputJoiner").value);
            const inputMember = parseFloat(document.getElementById("inputMember").value);
            const output = document.getElementById("output");

            // --- Validation ---
            if (isNaN(hours) || isNaN(people) || isNaN(inputJoiner) || isNaN(inputMember) || people <= 0) {
                output.innerHTML = `<span class="text-red-500 font-semibold">⚠️ กรุณากรอกข้อมูลให้ครบทุกช่อง และจำนวนคน (ใช้หาร) ต้องมากกว่า 0</span>`;
                output.classList.remove('bg-gray-50', 'bg-orange-100');
                output.classList.add('bg-red-100');
                return;
            }
            
            // Check if total people equals the divider
            if (inputJoiner + inputMember !== people) {
                 output.innerHTML = `<span class="text-orange-500 font-semibold">⚠️ คำเตือน: จำนวนคนแจม + สมาชิก (รวม ${inputJoiner + inputMember} คน) ไม่เท่ากับจำนวนคนทั้งหมดที่ใช้หาร ( ${people} คน)</span>`;
                 output.classList.remove('bg-gray-50', 'bg-red-100');
                 output.classList.add('bg-orange-100');
                 // Continue calculation despite the warning
            } else {
                 output.classList.remove('bg-red-100', 'bg-orange-100');
                 output.classList.add('bg-gray-50');
            }
            // --- Calculation ---

            // Base rate per hour for room cost (before dividing by people)
            const ROOM_RATE_JOINER_PER_HOUR = 160;
            const ROOM_RATE_MEMBER_PER_HOUR = 150;
            const SERVICE_FEE_JOINER = 80; // Fixed additional fee for joiners

            // 1. Calculate Room Cost per person (Integer by cutting fractions, no rounding)
            const baseRoomCostJoiner = (ROOM_RATE_JOINER_PER_HOUR * hours) / people;
            const baseRoomCostMember = (ROOM_RATE_MEMBER_PER_HOUR * hours) / people;

            // Apply Math.floor to keep only the integer part (no rounding, no adjustment for even number)
            const roomCostJoiner = Math.floor(baseRoomCostJoiner);
            const roomCostMember = Math.floor(baseRoomCostMember);

            // 2. Calculate Final Rate per person (Including fixed fee)
            const joinerRate = roomCostJoiner + SERVICE_FEE_JOINER;
            const memberRate = roomCostMember;

            // 3. Calculate Total for each group
            const totalJoiner = inputJoiner * joinerRate;
            const totalMember = inputMember * memberRate;
            const grandTotal = totalJoiner + totalMember;

            // --- Display Result ---
            output.innerHTML += `
                <strong class="block text-lg mb-3 text-blue-600">📊 สรุปผลการคำนวณ (จำนวนเต็ม ไม่ปัดเศษ):</strong>
                
                <div class="grid grid-cols-2 gap-2 text-base border-b pb-2 mb-2">
                    <span class="font-bold text-gray-800">ค่าห้อง/ชม. คนแจม (160)</span>
                    <span class="text-right">${ROOM_RATE_JOINER_PER_HOUR} x ${hours} ชม. / ${people} คน</span>
                </div>
                
                <div class="space-y-1 mt-4 p-2 bg-blue-50 rounded-lg">
                    <p>
                        ➕ <span class="font-bold text-blue-700">ค่าคนแจมต่อคน:</span> 
                        <strong class="float-right text-xl">${joinerRate}</strong> บาท
                    </p>
                    <p class="text-xs text-gray-500 ml-5">
                        (ค่าห้องที่ตัดทศนิยม ${roomCostJoiner} + ค่าบริการ ${SERVICE_FEE_JOINER})
                    </p>
                    <p>
                        ➕ <span class="font-bold text-blue-700">ค่าสมาชิกต่อคน:</span> 
                        <strong class="float-right text-xl">${memberRate}</strong> บาท
                    </p>
                     <p class="text-xs text-gray-500 ml-5">
                        (ค่าห้องที่ตัดทศนิยม ${roomCostMember})
                    </p>
                </div>
                
                <div class="mt-4 pt-4 border-t border-gray-300">
                    <p class="text-lg font-semibold text-gray-800">
                        💰 ผลรวมคนแจม (${inputJoiner} คน): 
                        <strong class="float-right text-green-600">${totalJoiner}</strong> บาท
                    </p>
                    <p class="text-lg font-semibold text-gray-800">
                        💰 ผลรวมสมาชิก (${inputMember} คน): 
                        <strong class="float-right text-green-600">${totalMember}</strong> บาท
                    </p>
                </div>

                <div class="mt-4 p-3 bg-blue-100 rounded-lg font-extrabold text-xl text-blue-800">
                    🧮 <span class="text-blue-600">รวมทั้งหมด:</span> 
                    <strong class="float-right">${grandTotal}</strong> บาท
                </div>
            `;
        }
    </script>
</body>
</html>
